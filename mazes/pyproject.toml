[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mazes"
version = "0.1.0"
description = "Maze geometry and boundary operators for active-matter simulations"
requires-python = ">=3.10"
dependencies = ["numpy", "toner-tu"]

[tool.setuptools.packages.find]
where = ["src"]